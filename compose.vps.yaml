services:
  whatsapp-central-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /app/config/distribuidoras.json
      CONFIG_WRITABLE_PATH: /app/data/distribuidoras.json
      SQLITE_PATH: /app/data/state.sqlite
    volumes:
      - ./config:/app/config:ro
      - bot-state:/app/data
    networks:
      - evolution
    # The Evolution container calls the webhook through this private network.
    # Do not publish the unauthenticated health and metrics routes.

volumes:
  bot-state:

networks:
  evolution:
    external: true
    name: ${EVOLUTION_DOCKER_NETWORK:?Set EVOLUTION_DOCKER_NETWORK in .env}
